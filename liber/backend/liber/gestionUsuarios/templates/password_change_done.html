{% extends 'base.html' %}
{% load static %}

{% block title %}
  Contraseña cambiada
{% endblock %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4 p-sm-5 text-center">
            <i class="fas fa-check-circle fa-3x text-success mb-3"></i>
            <h2 class="fw-bold text-body mb-3">Contraseña cambiada</h2>
            <p class="text-muted mb-4">Tu contraseña se ha actualizado correctamente. Puedes seguir usando la aplicación con normalidad.</p>
            <a href="{% url 'gestionUsuarios:configuracion_cuenta' %}" class="btn btn-primary"><i class="fas fa-user-cog"></i> Volver a configuración</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
