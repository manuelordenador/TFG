{% extends 'base.html' %}
{% load static %}

{% block title %}Perfil{% endblock %}

{% block content %}
<h2 class="text-body">Bienvenido, {{ user.username }}</h2>
<p class="text-body">Email: {{ user.email }}</p>
<p class="text-body">Tipo de usuario: {{user.tipo}}</p>
<a href="{% url 'logout' %}" class="btn btn-danger">Cerrar sesión</a>
{% endblock %}
