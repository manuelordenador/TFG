
# docker-compose.prod.yml
services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: liber_web:latest
    container_name: liber_web
    restart: unless-stopped
    env_file: .env.prod
    networks:
      - net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - static_volume:/vol/web/static
      - media_volume:/vol/web/media

  nginx:
    image: nginx:1.25-alpine
    container_name: liber_nginx
    ports:
      - "80:80"
      - "443:443" #solo si está funcionando duckdns
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - static_volume:/vol/web/static:ro
      - media_volume:/vol/web/media:ro
    networks:
      - net
    depends_on:
      web:
        condition: service_started
      certbot:
        condition: service_completed_successfully
      

  db:
    image: postgres:16
    container_name: liber_bd
    restart: unless-stopped
    env_file: .env.prod
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
    volumes:
      - pgdata_prod:/var/lib/postgresql/data

  cron:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: liber_web:latest
    container_name: liber_cron
    environment:
      - TZ=Europe/Madrid
    env_file: .env.prod
    networks:
      - net
    entrypoint: ["supercronic", "-passthrough-logs", "/app/crontab"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  
  certbot:
    image: infinityofspace/certbot_dns_duckdns:latest
    env_file: .env.prod
    command:
      - certonly
      - --non-interactive
      - --agree-tos
      - --keep-until-expiring
      - --email
      - "${CERTBOT_EMAIL}"
      - --preferred-challenges
      - dns
      - --authenticator
      - dns-duckdns
      - --dns-duckdns-propagation-seconds
      - "60"
      - -d
      - "${DUCKDNS_DOMAIN}"
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_logs:/var/log/letsencrypt

# volúmenes donde se guardará información del servidor
volumes:
  pgdata_prod:
  certbot_certs:
  certbot_logs:
  static_volume:
  media_volume:

networks:
  net:
    driver: bridge