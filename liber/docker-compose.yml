services:
  db:
    image: postgres:16
    container_name: liber_bd
    restart: on-failure
    env_file: .env
    networks:
      - net
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin: 
    image: dpage/pgadmin4
    container_name: liber_pgadmin
    env_file: .env
    networks:
      - net
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  web:
    build: ./backend
    container_name: liber_backend
    volumes:
      - ./backend:/app
    networks:
      - net
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  cron:
    build: ./backend
    container_name: liber_cron
    environment:
      - TZ=Europe/Madrid
    volumes:
      - ./backend:/app
    networks:
        - net
    env_file:
      - .env
    entrypoint: ["supercronic", "-passthrough-logs", "/app/crontab"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    
networks:
  net:
    driver: bridge

# declaración de volúmenes para persistencia de datos
volumes:
  postgres_data:
  pgadmin_data: