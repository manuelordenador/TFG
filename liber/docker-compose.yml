services:
  db:
    image: postgres:16
    container_name: liber_bd
    restart: always
    environment:
      POSTGRES_DB: liber_bd
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    networks:
      - net
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d liber_bd"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin: 
    image: dpage/pgadmin4
    container_name: liber_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ejemplo.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - net
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  web:
    build: ./backend
    container_name: liber_backend
    # command: python liber/manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    networks:
      - net
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=liber_bd
      - DB_USER=admin
      - DB_PASSWORD=admin
      - DB_PORT=5432
      - RUN_MIGRATIONS=true
      - RUN_PIP=true
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data: