# ── HTTP (puerto 80) ──────────────────────────────────────────────
server {
    listen 80;
    server_name liberapp.duckdns.org localhost 127.0.0.1;

    # con certificados, redirige a HTTPS.
    # si se depliega localmente, comentar el return 301.
    return 301 https://$host$request_uri;

    location /static/ {
        alias /vol/web/static/;
        expires 30d;
    }

    location /media/ {
        alias /vol/web/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── HTTPS (puerto 443) ────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name liberapp.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/liberapp.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liberapp.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    location /static/ {
        alias /vol/web/static/;
        expires 30d;
    }

    location /media/ {
        alias /vol/web/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}